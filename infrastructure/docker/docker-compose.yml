services:
  # 1. PostgreSQL Multi-Tenant Database
  postgres:
    image: postgres:16-alpine
    container_name: ozhzo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ozhzo_verse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ozhzo_verse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Cache & PubSub
  redis:
    image: redis:7-alpine
    container_name: ozhzo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO Object Storage (S3 Mock for Local Development)
  minio:
    image: minio/minio:latest
    container_name: ozhzo_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 4. FastAPI Backend Service
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: ozhzo_api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ozhzo_verse
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres:5432/ozhzo_verse
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ENDPOINT=http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # 5. Next.js Web Client
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: ozhzo_web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

  # 6. Nginx Edge Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ozhzo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
