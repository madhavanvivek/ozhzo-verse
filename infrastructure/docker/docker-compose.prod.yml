# ==============================================================================
# Ozhzo Verse — Production Docker Compose Deployment Configuration
# ==============================================================================

services:
  # 1. PostgreSQL 16 Multi-Tenant Database
  postgres:
    image: postgres:16-alpine
    container_name: ozhzo_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-ozhzo_verse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-ozhzo_verse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 In-Memory Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: ozhzo_redis_prod
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Core API Service
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: ozhzo_api_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-ozhzo_verse}
      - DATABASE_URL_SYNC=postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-ozhzo_verse}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ALLOWED_ORIGINS=https://app.ozhzoverse.com,https://api.ozhzoverse.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # 4. Next.js Web Client
  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: ozhzo_web_prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=https://api.ozhzoverse.com/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

  # 5. Nginx Reverse Proxy with TLS
  nginx:
    image: nginx:alpine
    container_name: ozhzo_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  redis_data:
